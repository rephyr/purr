# purr settings. Pick a model with /model inside purr, or `purr -m <name>`.

default_model = "qwen3-coder-32k"

# /pr: the co-author on purr's commits is "purr-<model> <co_author_email>". GitHub shows that
# account's avatar next to the commit, so make purr a GitHub account with a cute picture and put
# its noreply email here (Settings > Emails), plus its name to show the picture in the PR text.
co_author_email = "336710534+purr-harness@users.noreply.github.com"
co_author_github = "purr-harness"

# When the model wants to stop after changing files, ask it once to check every part of the
# request is done (small models often stop halfway). purr bench's "purr-nocheck" turns it off.
final_check = true
# ...and runs the project's tests itself for that check, so the model sees the real result
final_check_tests = true
# After every edit: a syntax check and ruff's bug checks (undefined names, ...), and a guard
# against rewrites that would delete code ("# ... rest unchanged").
code_checks = true
# Training wheels: these follow the model unless you set them here. Local models get them all,
# API models (which purr bench showed don't need them) don't.
#  refine = "auto"    rewrite a short first message into a clear task (you approve it); "on" / "off"
#  reminders = true   every 8 model calls, remind the model of the request
#  edge_cases = true  in the final check, also try 2-3 edge cases the request implies
# Edits only on files the model has read (so old_text matches what's really there).
read_before_edit = true

# Max model calls in one turn before purr stops and asks you.
max_steps = 40

# /plan (or /mode plan): `planner` reads your request and splits it into tickets under
# <project>/.purr/tickets/, then `executor` does them one at a time, each in a fresh chat.
# Use a big, long-context model to plan and a small local model to do the work.
[plan]
planner = "ds-pro-or"
executor = "qwen3_6-iq3"

# purr adapts its limits to each model's `context` below: a 32k local model gets
# smaller tool results and compacts sooner than a 1M API model. A model that needs
# different numbers can override any of them, e.g.:
#   limits = { tool_output = 8000, compact_at = 0.7 }
# (keys: tool_output, read_lines, list_files, grep_matches, attach_max, compact_at,
#  prune_at, keep_recent_tools, repeat_limit)

[providers.ollama]
base_url = "http://127.0.0.1:11434/v1"

[providers.llamacpp]
# purr-turbo: llama.cpp's own server with speculative decoding (start it with `purr-turbo start`)
base_url = "http://127.0.0.1:8081/v1"

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
opencode_auth = "deepseek"  # no env variable? use the key from `opencode auth login deepseek`
# DeepSeek wants its thinking text sent back on every turn when tools are used (400 error otherwise).
echo_reasoning = "reasoning_content"
# Weekdays, UTC hours where prices are doubled.
peak_hours_utc = [[1, 4], [6, 10]]

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
opencode_auth = "openrouter"  # same key OpenCode uses
# Thinking models (DeepSeek, Kimi, GLM) want their thinking back when tools are used.
echo_reasoning = "reasoning"

# Which hosts may answer (sent with every OpenRouter call; OpenCode's config asks for the same,
# so benchmarks stay fair). Only well-known hosts, no fp4 copies (the cheapest no-name and fp4 hosts
# went off the rails and were slow), cheapest first among those that do 100+ tok/s.
[providers.openrouter.body.provider]
only = ["deepseek", "together", "fireworks", "deepinfra", "baseten", "novita", "parasail", "siliconflow", "alibaba", "z-ai", "moonshotai", "openai", "azure", "anthropic", "google-vertex", "amazon-bedrock", "groq", "cerebras"]
quantizations = ["int4", "int8", "fp8", "fp16", "bf16", "fp32", "unknown"]
sort = "price"
preferred_min_throughput = { p50 = 100 }

# ---- local models (free) ----

[models.qwen3-coder-32k]
provider = "ollama"
id = "qwen3-coder-32k"
context = 32768
body = { temperature = 0.7, top_p = 0.8 }

[models.qwen3-coder-64k]
provider = "ollama"
id = "qwen3-coder-64k"
context = 65536
body = { temperature = 0.7, top_p = 0.8 }

[models.gpt-oss-32k]
provider = "ollama"
id = "gpt-oss-32k"
context = 32768

[models.qwen3_6-32k]
provider = "ollama"
id = "qwen3.6-iq2-32k"
context = 32768
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

[models.qwen3_6-64k]
provider = "ollama"
id = "qwen3.6-iq2-64k"
context = 65536
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

# Qwen3.6 35B-A3B at IQ3_XXS (13.2 GB): the middle ground, better than IQ2, still (almost) all on the GPU
[models.qwen3_6-iq3]
provider = "ollama"
id = "qwen3.6-iq3-32k"
context = 32768
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

# the same IQ3 model through purr-turbo (needs `purr-turbo start`; Ollama's models are unloaded then)
[models.qwen3_6-iq3-turbo]
provider = "llamacpp"
id = "turbo"
context = 32768

# Qwen3.6 35B-A3B at Q4: smarter than the IQ2 ones, but 22 GB, so part of it runs on the CPU (slower)
[models.qwen3_6-q4]
provider = "ollama"
id = "qwen3.6-q4-32k"
context = 32768
body = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 1.5 }

# Qwen3.5 9.7B (Q4, 64k already set in Ollama): small enough to sit fully on the GPU
[models.qwen3_5-code]
provider = "ollama"
id = "qwen3.5-code"
context = 65536
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

