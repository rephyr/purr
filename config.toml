# Commands the model may run without asking (only simple ones: no ; && | $() > in them).
[permissions]
allow_run = ["ls", "ls *", "pwd", "cat *", "head *", "tail *", "wc *", "rg *", "grep *", "tree*",
             "git status*", "git diff*", "git log*", "git show*", "git branch"]
