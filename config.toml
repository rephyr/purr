# purr settings. Pick a model with /model inside purr, or `purr -m <name>`.

default_model = "qwen3-coder-32k"

# /pr: the co-author on purr's commits is "purr-<model> <co_author_email>". GitHub shows that
# account's avatar next to the commit, so make purr a GitHub account with a cute picture and put
# its noreply email here (Settings > Emails), plus its name to show the picture in the PR text.
co_author_email = "336710534+purr-harness@users.noreply.github.com"
co_author_github = "purr-harness"

# Max model calls in one turn before purr stops and asks you.
max_steps = 40

# purr adapts its limits to each model's `context` below: a 32k local model gets
# smaller tool results and compacts sooner than a 1M API model. A model that needs
# different numbers can override any of them, e.g.:
#   limits = { tool_output = 8000, compact_at = 0.7 }
# (keys: tool_output, read_lines, list_files, grep_matches, attach_max, compact_at,
#  prune_at, keep_recent_tools, repeat_limit)

[providers.ollama]
base_url = "http://127.0.0.1:11434/v1"

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
opencode_auth = "deepseek"  # no env variable? use the key from `opencode auth login deepseek`
# DeepSeek wants its thinking text sent back on every turn when tools are used (400 error otherwise).
echo_reasoning = "reasoning_content"
# Weekdays, UTC hours where prices are doubled.
peak_hours_utc = [[1, 4], [6, 10]]

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
opencode_auth = "openrouter"  # same key OpenCode uses
# Thinking models (DeepSeek, Kimi, GLM) want their thinking back when tools are used.
echo_reasoning = "reasoning"

# ---- local models (free) ----

[models.qwen3-coder-32k]
provider = "ollama"
id = "qwen3-coder-32k"
context = 32768
body = { temperature = 0.7, top_p = 0.8 }

[models.qwen3-coder-64k]
provider = "ollama"
id = "qwen3-coder-64k"
context = 65536
body = { temperature = 0.7, top_p = 0.8 }

[models.gpt-oss-32k]
provider = "ollama"
id = "gpt-oss-32k"
context = 32768

[models.qwen3_6-32k]
provider = "ollama"
id = "qwen3.6-iq2-32k"
context = 32768
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

[models.qwen3_6-64k]
provider = "ollama"
id = "qwen3.6-iq2-64k"
context = 65536
body = { temperature = 0.6, top_p = 0.95, presence_penalty = 1.5 }

# Qwen3.6 35B-A3B at Q4: smarter than the IQ2 ones, but 22 GB, so part of it runs on the CPU (slower)
[models.qwen3_6-q4]
provider = "ollama"
id = "qwen3.6-q4-32k"
context = 32768
body = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 1.5 }

# ---- DeepSeek (paid, needs DEEPSEEK_API_KEY) ----
# Prices: USD per 1M tokens, off-peak. Peak hours cost 2x.

[models.flash]
provider = "deepseek"
id = "deepseek-flash"
context = 1000000
price = { hit = 0.003, miss = 0.15, out = 0.60 }

[models.pro]
provider = "deepseek"
id = "deepseek-v4-pro"
context = 1000000
price = { hit = 0.022, miss = 0.66, out = 1.98 }

# ---- OpenRouter (paid, key from OpenCode or OPENROUTER_API_KEY) ----
# Prices: USD per 1M tokens (purr shows OpenRouter's real cost when it sends one).
# max_tokens stays at 16k: with a small balance OpenRouter refuses calls that could cost more.

[models.ds-pro-or]
provider = "openrouter"
id = "deepseek/deepseek-v4-pro"
context = 1000000
price = { hit = 0.0174, miss = 0.2088, out = 0.4176 }
body = { max_tokens = 16384 }

