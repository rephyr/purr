# (Inkling's free version would be here, but OpenRouter only gives it to apps on its own list.)
# /model free: purr picks the first model of the list for what you're doing (code: code, learn,
# pair, plan; ask; talk: chat, create) that isn't resting and fits the chat. A model that's
# rate-limited or out of free requests rests (until midnight UTC for the daily cap) and the
# request goes on to the next one. /free shows them; /free reset forgets the resting.
[models.free]
router = "free"
provider = "openrouter"
id = "(the free router picks)"
context = 262144
price = { hit = 0, miss = 0, out = 0 }

[free]
# Best first. A model whose provider has no key is skipped; one that's maxed out rests and the
# next takes over. The same model on several hosts (Qwen3.8, gpt-oss, Nemotron) is listed per host.
code = ["kimi-k3-nv", "glm53-nv", "deepseek-flash-nv", "laguna", "qwen38-cerebras", "qwen38-groq", "qwen38-free",
        "gptoss-cerebras", "gptoss-groq", "devstral", "gemini-flash", "nemotron-ultra-nv", "nemotron-ultra-free",
        "north-code-free", "codestral", "kimi-k26-nv", "nemotron-super-free", "gemini-flash-lite",
        "mistral-medium", "gemma4-31b-free", "laguna-xs", "llama70-groq", "openrouter-free"]
ask = ["gemini-flash", "gemini-pro", "kimi-k3-nv", "nemotron-ultra-free", "deepseek-flash-nv", "glm53-nv",
       "laguna", "qwen38-free", "dots-free", "mistral-large", "codestral", "qwen38-groq", "gemini-flash-lite",
       "nemotron-super-free", "openrouter-free"]
talk = ["kimi-k3-nv", "gemini-flash", "glm53-nv", "gemini-pro", "mistral-large", "gemma4-31b-free",
        "qwen38-groq", "qwen38-free", "nemotron-ultra-free", "command-a", "laguna", "openrouter-free"]

# Commands the model may run without asking (only simple ones: no ; && | $() > in them).
# ---- MCP servers: their tools are offered next to purr's own ----
# Each runs in the project folder; {purr} is purr's own folder. tools = [...] offers only some.
# purr's own two (servers/, plain Python, no packages) help small models find their way:
#   codebase: outline (a file, or a folder's code map), find_symbol; its project_overview goes in the system prompt
#   stack:    godot_class (your installed Godot's real API), python_api (the project's installed packages)
[mcp.codebase]
command = ["python3", "{purr}/servers/codebase.py"]

[mcp.stack]
command = ["python3", "{purr}/servers/stack.py"]

# overview_in_prompt = false   # don't put the project overview in the system prompt

[permissions]
allow_run = ["ls", "ls *", "pwd", "cat *", "head *", "tail *", "wc *", "rg *", "grep *", "tree*",
             "git status*", "git diff*", "git log*", "git show*", "git branch"]
